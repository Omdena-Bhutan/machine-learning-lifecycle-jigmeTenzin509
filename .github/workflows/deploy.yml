name: Deploy to Production

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      # 1. Login to container registry (GitHub Container Registry)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Build Docker image
      - name: Build Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/inference
          TAG=${{ github.ref_name }}
          docker build -t $IMAGE_NAME:$TAG .

      # 3. Push Docker image
      - name: Push Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/inference
          TAG=${{ github.ref_name }}
          docker push $IMAGE_NAME:$TAG

      # 4. Deploy to production
      - name: Deploy container
        run: |
          echo "Deploying $IMAGE_NAME:$TAG"
          # Example: kubectl / docker / ssh deploy command
          # kubectl set image deployment/inference inference=$IMAGE_NAME:$TAG

      # 5. Run smoke tests
      - name: Smoke tests
        run: |
          sleep 15
          curl --fail http://your-production-url/health
